# AURA_v2 duplex default deploy (private line): performance-bench layout.
# 2 GPU: Stage1 on GPU1, ASR / Talker / Code2Wav on GPU0. No eager.
# Stage1 = AURA_v2 (qwen3_5 / checkpoint-1318), max_model_len 65536, FLASHINFER.
# Online path: Realtime duplex (`/v1/realtime?duplex=1`).
pipeline: aura_omni
# Qwen3-TTS Stage2→3 codec handoff requires async_chunk=true (same as native /
# duplex explore). async_chunk=false reaches talker/code_predictor then never
# delivers audio to Stage3/client.
async_chunk: true
session_mode: duplex
duplex_session:
  # Session admission only. Orthogonal to per-stage max_num_seqs.
  max_sessions: 16

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      # initial=1 can stall Code2Wav on the first undersized chunk.
      initial_codec_chunk_frames: 8
      decode_cudagraph_capture_sizes: [25, 73, 97, 169, 325]

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.08
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_model_len: 4096
    max_num_batched_tokens: 2048
    devices: "0"
    model: /workspace/models/Qwen3-ASR-1.7B
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 256

  - stage_id: 1
    max_num_seqs: 8
    gpu_memory_utilization: 0.9
    enforce_eager: false
    trust_remote_code: true
    # Qwen3.5 hybrid attention has multiple KV groups, which the Omni
    # stage-output cache refuses. The model sets uses_native_kv_cache_only, so
    # this turns on vLLM's native KV + aligned GDN-state prefix cache only
    # (vLLM derives mamba_cache_mode=align from this flag).
    enable_prefix_caching: true
    # Two-token logits reads the live output list; async can leave it stale.
    async_scheduling: false
    max_model_len: 65536
    max_num_batched_tokens: 8192
    devices: "1"
    attention_backend: FLASHINFER
    model: /workspace/models/AURA_v2
    model_arch: AuraQwen3_5ForConditionalGeneration
    logits_processors:
      - "vllm_omni.model_executor.models.aura_omni.two_token_logits:AuraTwoTokenLogitsProcessor"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      # 1 control + body budget (inference default).
      max_tokens: 1025
      min_tokens: 0
      repetition_penalty: 1.0
      stop_token_ids: [248070, 248046]

  - stage_id: 2
    max_num_seqs: 4
    gpu_memory_utilization: 0.15
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    attention_backend: FLASHINFER
    # Stage1→2 is orchestrator-fed via aura2tts. Only Stage2→3 uses SHM.
    output_connectors:
      to_stage_3: connector_of_shared_memory
    model: /workspace/models/Qwen3-TTS-12Hz-1.7B-CustomVoice
    default_sampling_params:
      temperature: 0.5
      top_k: 50
      max_tokens: 1024
      min_tokens: 8
      repetition_penalty: 1.05
      stop_token_ids: [2150]
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.5
      top_k: 50
      top_p: 1.0

  - stage_id: 3
    max_num_seqs: 4
    gpu_memory_utilization: 0.15
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 16384
    max_model_len: 16384
    devices: "0"
    input_connectors:
      from_stage_2: connector_of_shared_memory
    model: /workspace/models/Qwen3-TTS-12Hz-1.7B-CustomVoice
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 16384
      seed: 42
      repetition_penalty: 1.0
