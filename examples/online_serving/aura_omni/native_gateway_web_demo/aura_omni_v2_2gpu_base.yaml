# AURA_v2 Native-frontend 2-GPU demo (Base TTS).
# Layout: Stage0 ASR + Stage2/3 TTS on GPU0; Stage1 AURA on GPU1.
# devices are relative to CUDA_VISIBLE_DEVICES.
# Per-card budget ~0.8: GPU0 0.20+0.30+0.30, GPU1 0.80. Each stage is its own
# vLLM process, so these fractions are of the full card, not leftover memory.
pipeline: aura_omni
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 20
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 8
      decode_cudagraph_capture_sizes:
      - 25
      - 73
      - 97
      - 169
      - 325
stages:
- stage_id: 0
  max_num_seqs: 1
  gpu_memory_utilization: 0.2
  trust_remote_code: true
  enable_prefix_caching: true
  async_scheduling: true
  max_model_len: 4096
  max_num_batched_tokens: 2048
  devices: '0'
  model: /workspace/models/Qwen3-ASR-1.7B
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 256
- stage_id: 1
  max_num_seqs: 1
  gpu_memory_utilization: 0.8
  trust_remote_code: true
  enable_prefix_caching: true
  mm_processor_cache_gb: 1
  async_scheduling: true
  max_model_len: 32768
  max_num_batched_tokens: 8192
  devices: '1'
  model: /workspace/models/AURA_v2
  model_arch: AuraQwen3_5ForConditionalGeneration
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 256
    repetition_penalty: 1.0
    stop_token_ids:
    - 248070
    - 248046
  attention_backend: FLASHINFER
  mm_encoder_attn_backend: FLASHINFER
- stage_id: 2
  max_num_seqs: 1
  gpu_memory_utilization: 0.3
  enforce_eager: false
  trust_remote_code: true
  enable_prefix_caching: false
  async_scheduling: true
  max_num_batched_tokens: 4096
  max_model_len: 4096
  devices: '0'
  attention_backend: FLASHINFER
  input_connectors:
    from_stage_1: connector_of_shared_memory
  output_connectors:
    to_stage_3: connector_of_shared_memory
  model: /workspace/models/hub/models--Qwen--Qwen3-TTS-12Hz-1.7B-Base/snapshots/fd4b254389122332181a7c3db7f27e918eec64e3
  default_sampling_params:
    temperature: 0.5
    top_k: 50
    max_tokens: 4096
    min_tokens: 8
    repetition_penalty: 1.05
  subtalker_sampling_params:
    do_sample: true
    temperature: 0.5
    top_k: 50
    top_p: 1.0
- stage_id: 3
  max_num_seqs: 1
  gpu_memory_utilization: 0.3
  enforce_eager: false
  trust_remote_code: true
  enable_prefix_caching: false
  async_scheduling: true
  max_num_batched_tokens: 16384
  max_model_len: 16384
  devices: '0'
  input_connectors:
    from_stage_2: connector_of_shared_memory
  model: /workspace/models/hub/models--Qwen--Qwen3-TTS-12Hz-1.7B-Base/snapshots/fd4b254389122332181a7c3db7f27e918eec64e3
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 16384
    seed: 42
    repetition_penalty: 1.0
